[platformio]
default_envs = cardputer-adv

[env:cardputer-adv]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = dio_qspi
board_build.flash_mode = dio
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = default_8MB.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DCORE_DEBUG_LEVEL=1
lib_deps =
	m5stack/M5Cardputer@^1.1.1
	; 0.3.0 rewrote board detection; pin the last 0.2.x releases
	m5stack/M5Unified@0.2.29
	m5stack/M5GFX@0.2.36
	mikalhart/TinyGPSPlus@^1.1.0
	bblanchon/ArduinoJson@^7.2.1
extra_scripts = post:scripts/dist.py

; Host-side unit tests for lib/navcore: `pio test -e native`
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra -DUNITY_INCLUDE_DOUBLE -DUNITY_DOUBLE_PRECISION=1e-12

; Debug build for the Espressif QEMU emulator: logs go to UART0 instead of USB CDC.
[env:qemu]
extends = env:cardputer-adv
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=0
	-DCORE_DEBUG_LEVEL=4
	-DGPSNAV_DEBUG_KEYS=1
extra_scripts =
